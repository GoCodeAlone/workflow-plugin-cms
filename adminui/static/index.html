<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Multisite Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <h1>Multisite Admin</h1>
    <button id="btn-reload" type="button">Reload tenants cache</button>
  </header>

  <main>
    <section id="tenants-section">
      <h2>Tenants</h2>
      <table id="tenants-table">
        <thead><tr><th>ID</th><th>Slug</th><th>Label</th><th>Theme</th><th></th></tr></thead>
        <tbody id="tenants-body"></tbody>
      </table>

      <h3>New tenant</h3>
      <form id="new-tenant-form">
        <label>Slug <input name="slug" required pattern="[a-z0-9-]+" placeholder="acme"></label>
        <label>Label <input name="label" required placeholder="Acme Inc"></label>
        <label>Theme <input name="theme_id" placeholder="default"></label>
        <button type="submit">Create</button>
      </form>
    </section>

    <section id="tenant-detail-section" hidden>
      <h2>Tenant: <span id="td-slug"></span></h2>
      <p><button id="btn-back" type="button">← back</button></p>

      <h3>Domains</h3>
      <table id="domains-table">
        <thead><tr><th>Host</th><th>Subsite</th><th>Kind</th><th></th></tr></thead>
        <tbody id="domains-body"></tbody>
      </table>
      <form id="new-domain-form">
        <label>Host <input name="host" required placeholder="acme.example"></label>
        <label>Subsite <input name="subsite_label" placeholder="(root)"></label>
        <label>Kind
          <select name="kind">
            <option value="vanity">vanity</option>
            <option value="preview">preview</option>
            <option value="subdomain">subdomain</option>
          </select>
        </label>
        <button type="submit">Add</button>
      </form>

      <h3>Pages</h3>
      <table id="pages-table">
        <thead><tr><th>ID</th><th>Path</th><th>Title</th><th>Status</th><th></th></tr></thead>
        <tbody id="pages-body"></tbody>
      </table>
      <section id="page-editor-section" class="editor-panel" hidden>
        <h4>Edit page</h4>
        <form id="page-editor-form">
          <input type="hidden" name="id">
          <label>Path <input name="path" required placeholder="/welcome"></label>
          <label>Title <input name="title" required placeholder="Welcome"></label>
          <label>Status
            <select name="status">
              <option value="draft">draft</option>
              <option value="published">published</option>
              <option value="scheduled">scheduled</option>
              <option value="archived">archived</option>
            </select>
          </label>
          <label>Template <input name="template_id" placeholder="default"></label>
          <label>Publish at <input name="publish_at" type="datetime-local"></label>
          <label>Unpublish at <input name="unpublish_at" type="datetime-local"></label>
          <div class="form-row full">
            <span>Body</span>
            <div class="rich-editor" data-rich-editor>
              <div class="editor-toolbar" role="toolbar" aria-label="Page editor tools">
                <button type="button" data-editor-command="formatBlock" data-editor-value="h2">H2</button>
                <button type="button" data-editor-command="formatBlock" data-editor-value="h3">H3</button>
                <button type="button" data-editor-command="bold"><strong>B</strong></button>
                <button type="button" data-editor-command="italic"><em>I</em></button>
                <button type="button" data-editor-command="insertUnorderedList">List</button>
                <button type="button" data-editor-command="formatBlock" data-editor-value="blockquote">Quote</button>
                <button type="button" data-editor-action="link">Link</button>
                <button type="button" data-editor-action="source">HTML</button>
              </div>
              <div class="editor-surface" contenteditable="true" data-editor-surface aria-label="Page body"></div>
              <textarea name="body_html" rows="12" data-editor-source hidden></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit">Save page</button>
            <button id="btn-page-preview" type="button">Preview</button>
            <button id="btn-page-editor-close" type="button">Close</button>
          </div>
        </form>
        <iframe id="page-preview" title="Page preview" hidden></iframe>
      </section>
      <details>
        <summary>New page</summary>
        <form id="new-page-form">
          <label>Path <input name="path" required placeholder="/welcome"></label>
          <label>Title <input name="title" required placeholder="Welcome"></label>
          <label>Status
            <select name="status">
              <option value="draft">draft</option>
              <option value="published">published</option>
              <option value="scheduled">scheduled</option>
              <option value="archived">archived</option>
            </select>
          </label>
          <label>Template <input name="template_id" placeholder="default"></label>
          <label>Publish at <input name="publish_at" type="datetime-local"></label>
          <label>Unpublish at <input name="unpublish_at" type="datetime-local"></label>
          <div class="form-row full">
            <span>Body</span>
            <div class="rich-editor" data-rich-editor>
              <div class="editor-toolbar" role="toolbar" aria-label="New page editor tools">
                <button type="button" data-editor-command="formatBlock" data-editor-value="h2">H2</button>
                <button type="button" data-editor-command="formatBlock" data-editor-value="h3">H3</button>
                <button type="button" data-editor-command="bold"><strong>B</strong></button>
                <button type="button" data-editor-command="italic"><em>I</em></button>
                <button type="button" data-editor-command="insertUnorderedList">List</button>
                <button type="button" data-editor-command="formatBlock" data-editor-value="blockquote">Quote</button>
                <button type="button" data-editor-action="link">Link</button>
                <button type="button" data-editor-action="source">HTML</button>
              </div>
              <div class="editor-surface" contenteditable="true" data-editor-surface aria-label="New page body"></div>
              <textarea name="body_html" rows="8" data-editor-source hidden></textarea>
            </div>
          </div>
          <button type="submit">Create page</button>
        </form>
      </details>
    </section>
  </main>

  <div id="toast" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
