syntax = "proto3";

package workflow.plugins.cms.v1;

option go_package = "github.com/GoCodeAlone/workflow-plugin-cms/internal/contracts;contracts";

message TenantResolverConfig {
  string preview_subdomain_base = 1;
  string on_unknown_domain = 2;
}

message StaticServeBeforeDynamicConfig {
  string bundle_root = 1;
}

message EngineConfig {
  string provider = 1;
  string bundle_storage = 2;
  string db_url = 3;
  string content_repo_token = 4;
  string default_theme_id = 5;
}

message CMSAdminContributionInput {
  bool authorized = 1;
}

message CMSAdminContribution {
  string id = 1;
  string title = 2;
  string category = 3;
  string path = 4;
  string render_mode = 5;
  string app_context = 6;
  repeated string permissions = 7;
  map<string, string> metadata = 8;
  repeated string actions = 9;
}

message CMSAdminContributionOutput {
  CMSAdminContribution contribution = 1;
  string error = 100;
}

message AnalyticsInjectionConfig {
  string mode = 1;
}

message CMSRenderPageStepConfig {
  string content_type = 1;
}

message CMSRenderPageStepInput {
  int64 tenant_id = 1;
  string subsite = 2;
  string path = 3;
  string title = 4;
  string body_html = 5;
}

message CMSRenderPageStepOutput {
  bool rendered = 1;
  int64 tenant_id = 2;
  string subsite = 3;
  string path = 4;
  string title = 5;
  string html = 6;
  string content_type = 7;
}

message CMSBundleActivateStepConfig {
  string bundle_root = 1;
  string token = 2;
}

message CMSBundleActivateStepInput {
  string tenant_slug = 1;
  string version = 2;
  string tarball_url = 3;
}

message CMSBundleActivateStepOutput {
  bool activated = 1;
  string tenant_slug = 2;
  string version = 3;
  string sha256 = 4;
}
